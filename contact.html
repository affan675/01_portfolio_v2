<!-- FILE: contact.html -->
<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Affan Adil – Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/preloader.css" />
    <link rel="stylesheet" href="css/cursor.css" />
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-card">
        <div class="preloader-icon">💡</div>
        <p class="preloader-label">Loading contact form...</p>
        <div class="preloader-progress-container">
          <div class="preloader-progress-bar" id="progressBar"></div>
          <span class="preloader-percentage" id="progressText">0%</span>
        </div>
      </div>
    </div>
    <div id="blast-overlay"></div>
    <div id="blast-particles"></div>
    <div id="main-content" class="content-hidden">
      <nav class="navbar" id="navbar">
        <div class="nav-container">
          <a href="index.html" class="nav-logo">AA</a>
          <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
          <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="report.html">Report</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
          </ul>
          <div class="theme-toggle-group">
            <button
              class="theme-btn"
              data-theme-btn="light"
              aria-label="Light mode"
            >
              ☀️
            </button>
            <button
              class="theme-btn"
              data-theme-btn="dark"
              aria-label="Dark mode"
            >
              🌙
            </button>
            <button
              class="theme-btn"
              data-theme-btn="tech"
              aria-label="Tech mode"
            >
              🧬
            </button>
          </div>
        </div>
      </nav>

      <main>
        <h1 class="section-title">Get in Touch</h1>
        <div class="badge freelance-badge">
          🔥 Accepting 5 new freelance client this month – limited slots
        </div>
        <form class="contact-form" id="contactForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
        <div class="social-links">
          <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
          <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="#" aria-label="Discord"><i class="fab fa-discord"></i></a>
        </div>
      </main>

      <footer class="footer">
        <p>&copy; 2026 Affan Adil. All rights reserved.</p>
        <p class="footer-motto">Discipline &gt; Motivation</p>
      </footer>
    </div>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <div id="toast-container"></div>

    <script src="js/theme.js"></script>
    <script src="js/preloader.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/typing.js"></script>
    <script src="js/counters.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/tab-visibility.js"></script>
    <canvas id="particle-canvas"></canvas>
    <script src="js/particle.js"></script>
    <script src="js/particles-config.js"></script>
    <script src="js/right-click.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/shortcuts.js"></script>
    <script>
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          alert("Thanks! I'll get back to you soon (demo mode).");
        });
    </script>
  </body>
</html>
